spring:
  application:
    name: budzet

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/budzet?serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

management:
  endpoints:
    access:
      default: none

springdoc:
  default-produces-media-type: application/json
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: INFO
    com.budzet: DEBUG

custom:
  jwt:
    access-secret: ${ACCESS_SECRET}
    access-expire-millis: "#{1000L * 60 * 60}" #1시간
    refresh-secret: ${REFRESH_SECRET}
    refresh-expire-millis: "#{1000L * 60 * 60 * 24 * 7}" #1주일

---

# 개발 환경의 Actuator 설정
spring:
  config:
    activate:
      on-profile: "!prod & !test"

management:
  endpoint:
    health:
      access: read-only
      show-details: never
    metrics:
      access: read-only
    prometheus:
      access: read-only
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

custom:
  monitoring:
    password: ${PROMETHEUS_PASSWORD:}
