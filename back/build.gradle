import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'java'
    id 'org.sonarqube' version '7.5.0.8588'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.4.21'
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.4.21'
}

group = 'com.budzet'
version = '0.0.1-SNAPSHOT'
description = 'budzet'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_25
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'tools.jackson.module:jackson-module-kotlin'
    implementation("io.jsonwebtoken:jjwt-api:0.13.0")
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    runtimeOnly("io.jsonwebtoken:jjwt-impl:0.13.0")
    runtimeOnly("io.jsonwebtoken:jjwt-jackson:0.13.0")
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation("org.springframework.boot:spring-boot-starter-security")
    testImplementation("org.springframework.security:spring-security-test")
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
    implementation 'org.springframework.retry:spring-retry:2.0.13'
    implementation 'org.springframework:spring-aspects:6.2.12'
    testImplementation platform("org.testcontainers:testcontainers-bom:1.21.4")
    testImplementation "org.testcontainers:junit-jupiter"
    testImplementation "org.testcontainers:mysql"
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'
}

// Keep the initial migration snapshot separate from Java and reviewed Kotlin results.
// Override with -Dsonar.projectKey=... when analyzing another snapshot.
sonar {
    properties {
        property 'sonar.projectKey', 'budzet-kotlin-initial'
        property 'sonar.host.url', 'http://localhost:9000'
        property 'sonar.sourceEncoding', 'UTF-8'
    }
}

// The scanner needs compiled production and test classes; it does not run tests.
tasks.named('sonar') {
    dependsOn tasks.named('testClasses')
}
